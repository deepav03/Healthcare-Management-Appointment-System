[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: critical fast checks
    regression: broader regression coverage
    ui: Selenium browser tests
    api: Python Requests API tests
    database: live MySQL validation tests
    e2e: cross-layer UI/API/database workflows
log_cli = true
log_cli_level = INFO
log_file = reports/qa.log
log_file_level = INFO
